[project]
name = "openevalz-eval-castle"
version = "0.1.0"
description = "OpenEvalz packaging of CASTLE: CWE Automated Security Testing and Low-Level Evaluation"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "castle"
execution_class = "plain"
cost_class = "low"
